name: build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps3dev/psl1ght:latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: make pkg
      - uses: actions/upload-artifact@v4
        with:
          name: dinorun
          path: dinorun.pkg
